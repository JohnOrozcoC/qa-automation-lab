name: Playwright Tests

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]
  
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t playwright-lab:1.0 .

      - name: Run smoke tests in Docker
        run: |
          mkdir -p reports
          docker run --rm \
            -e ENVIRONMENT=QA \
            -v "$GITHUB_WORKSPACE/reports:/app/reports" \
            playwright-lab:1.0 \
            pytest -m smoke \
              --html=reports/smoke-report.html \
              --self-contained-html

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-report
          path: reports/